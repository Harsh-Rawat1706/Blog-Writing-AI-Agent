services:
  - type: web
    name: blog-writing-ai-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run agent_frontend.py --server.port $PORT --server.address 0.0.0.0 --server.fileWatcherType none
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false